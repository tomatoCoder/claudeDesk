appId: com.claudedesk.desktop
productName: Claude Desk
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - package.json
  - node_modules/**
extraResources:
  - from: bridge/dist
    to: bridge/dist
  - from: bridge/node_modules
    to: bridge/node_modules
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/bindings/**
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - dmg
    - zip
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
