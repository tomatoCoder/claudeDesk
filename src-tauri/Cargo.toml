[package]
name = "claude-desk"
version = "0.1.0"
description = "A local desktop client for Claude Code CLI"
authors = ["Claude Desk contributors"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "claude_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
http = "1"
percent-encoding = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
semver = "1"
which = "8"
dirs = "6"
tempfile = "3"
libc = "0.2"
parking_lot = "0.12"
tokio-util = "0.7"
wait-timeout = "0.2"
trash = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSDictionary", "NSString", "NSURL", "NSValue"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }
